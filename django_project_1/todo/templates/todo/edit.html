<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit List</title>
    <link rel="stylesheet" href="/static/edit.css">
</head>
<body>
    <div class="edit-container">
        <h1>Edit Task</h1>
        <form method="POST">
            {% csrf_token %}
            <input type="text" name="task_name" value="{{ task.name }}" required>
            <input type="text" name="task_deadline" value="{{ task.deadline }}">
            <textarea name="task_description">{{ task.description }}</textarea>
            <button type="submit">Save Changes</button>
        </form>
        <a class="cancel-btn" href="{% url 'todo' %}">Cancel</a>
    </div>
</body>
</html>
