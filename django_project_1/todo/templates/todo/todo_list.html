<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="/static/todolist.css">

<body>
    <nav class="navbar">
        <div class="logo">To-Do List</div>
        <div class="nav-links">
            <a href="{% url 'logout' %}" class="btn logout">Logout</a>
        </div>
    </nav>

    <div class="container">
        <h1>Welcome, {{ user.username }}!</h1>

        <!-- Task Input Form -->
        <div class="task-form">
            <form method="POST">
                {% csrf_token %}
                <input type="text" name="task_name" placeholder="Task Title" required>
                <input type="text" name="task_deadline" placeholder="Deadline">
                <textarea class="about-section" name="task_description" placeholder="About Task"></textarea>
                <button type="submit">Add Task</button>
            </form>
        </div>

        <!-- Task List -->
        <div class="task-table">
            <div class="task-header">
                <span>Task Title</span>
                <span>Due:</span>
                <span>Description</span>
                <span>-</span>
            </div>

            {% for task in tasks %}
            <div class="task-row">
                <span>{{ task.name }}</span>
                <span>{{ task.deadline }}</span>
                <span>
                    <button type="button" onclick="toggleDescription('desc{{ task.id }}')">View</button>
                    <p id="desc{{ task.id }}" class="task-desc" style="display: none;">{{ task.description }}</p>
                </span>
                <span>
                    <a href="{% url 'delete_task' task.id %}" class="delete-btn"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-x-circle" viewBox="0 0 16 16">
                        <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"/>
                        <path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708"/>
                      </svg></a>
                </span>
            </div>            
            {% endfor %}
        </div>
    </div>
</head>
<script>
    function toggleDescription(id) {
        var desc = document.getElementById(id);
        if (desc.style.display === "none" || desc.style.display === "") {
            desc.style.display = "block"; // Show the description
        } else {
            desc.style.display = "none"; // Hide the description
        }
    }
</script>


</body>
</html>
