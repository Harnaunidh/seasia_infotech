<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="/static/login.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">To-Do List</div>
    </nav>
    <div class="container">
        <h1>Login:</h1>

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Login</button>
        </form>

        <p>Don't have an account? <a style="text-shadow:1px 1px 2px rgb(56, 56, 56)" href="{% url 'register' %}">Sign up</a></p>
    </div>
</body>
</html>
